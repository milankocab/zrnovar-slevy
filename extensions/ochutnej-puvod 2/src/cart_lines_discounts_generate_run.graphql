query CartInput {
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          id
        }
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            productType
            isBlend: hasAnyTag(tags: ["směs"])
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
